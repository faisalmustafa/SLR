- title: About this online book
  path: about.html
  description: >
    Learning this type of research was quite a journey for myself, and thus I do not intend to let this process goes to waste because not all academicians have a learning chance as I did. Therefore, the purpose of this book is to describe the process of Systematic Literature Review research as I learned it through reading and collaborations. Allow me to share how I learned this type of research before I describe how this book is presented.
  date: 11/23/2025

- title: Introduction
  path: intro.html
  description: >
    Systematic Literature Review (SLR) has become more increasingly popular among researchers. This type of research refers to a systematic process of obtaining reliable literature to be analyze and synthesize *accurately*. What differentiate this type of literature review to traditional one is that SLR emphasizes on systematicity, which means that all process in SLR research is reproducable. Therefore, researchers need to report all process accurately and in details, while maintaining that the process lead to accurate research findings. SLR is significant for some reasons.
  date: 11/23/2025

- title: Steps in conducting a systematic literature review
  path: steps.html
  description: >
    The systematic literature review consists of three main steps, i.e. reviewed study preparation, coding, and report writing. Each of these steps consists of several workflows. These workflows become the focus of this book. The description of each workflow is given briefly in this section.
  date: 11/23/2025

- title: Determining topics for Systematic Literature Review
  path: topics.html
  description: >
    The first step of conducting systematic literature review research is determining the topic for the research. This topic can come from one of the following activities or efforts. First, when you notice that there is an inconsistency in the literature about how a concept is defined, there is a potential to establish a standard conceptualization through systematic literature review research.
  date: 11/23/2025

- title: Selecting databases for systematic literature review
  path: database.html
  description: >
    The rule of thumb is that the database used needs to be indexing databases which include journals or book chapters after assessment involving management and content quality. Google Scholar includes any academic publication without any assessment, and thus they are not elligible to be selected for systematic literature review research. Another indexing platform is DOAJ, which indexes journals after an assessment; however, the assessment tend to focus only on journal management, not the quality of research and reporting. Thus, DOAJ is also not elligible for systematic literature review paper. One of a good example is Scopus, because it includes journals and book chapters after a series of assessment by expert team with well-established selection criteria targetting management and content quality, even extended to journal standing (i.e., citedness of journal articles in Scopus and its editor reputation).
  date: 11/24/2025

- title: Keywords and search
  path: search.html
  description: >
    Keywords are very significant in systematic literature review. Incorrecly using keywords can put excessively extend the time of completing the project. If the keywords needs to be revised in the middle of a project, the team members have to start working from the beginning because more papers need to be screened. Therefore, the team members responsible for searching the databases need to play around with the keywords before finalizing them.
  date: 11/24/2025

- title: Abstract screening
  path: abstract-screening.html
  description: >
    Before the initial screening, the search results from multiple databases need to be combined. There is high possibility that the combined list to consist of duplicates. These duplicates need to be eliminated by keeping only one record of each article. Systematic literature review tools such as Cofidence and Rayyan can automatically detect duplicates using AI, but they are not free. We can also detect duplicated documents using Microsoft Excel, utilizing sorting and conditional formatting features.
  date: 11/25/2025

- title: Full text retrieval
  path: retrieval.html
  description: >
    Full text retrieval process should be straightforward if your institution have adequate subscription. As previously mentioned, the researcher team or at least one of the team members needs to have access to non-open access publishers so they can retrieved all articles selected after the abstract screening.
  date: 12/2/2025

- title: Full text screening
  path: pdf-screening.html
  description: >
    This second screening phase is the most important phase to eliminate articles which fall outside the focus of the study. The objective of full text screening is to determine if the articles meet the inclusion and exclusion criteria by scanning the full text. Therefore, I propose that the screening process is combined with quality appraisal.
  date: 12/2/2025

- title: Introduction to coding qualitative data
  path: intro_coding.html
  description: >
    Text data such as interview transcrips and research papers consist of a bunch of statements. Coding is a process of assigning themes to parts of these texts to be able to make sense of them and summarize them into a manageable representation. Consider the following part of interview transcript, with the relevant parts that I have highlighted. In this case, let’s find out “what are the problems experienced by senior teachers in using technology for teaching.”
  date: 04/26/2026

- title: Developing codebooks
  path: develop_codebook.html
  description: >
    Among other categorization, there are two types of coding, which shape how codebooks are developed, i.e., inductive coding and deductive coding. In inductive analysis, the codebook is developed based on what we find in the data, as the showcase in Chapter 10, and deductive coding uses a pre-determined framework or an existing theory as the codebook.
  date: 04/26/2026

